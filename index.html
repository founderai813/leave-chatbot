<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>差勤小幫手 — 公務人員差勤法規諮詢</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #4f46e5;
  --primary-light: #e0e7ff;
  --user-bubble: #4f46e5;
  --bot-bubble: #f3f4f6;
  --bg: #f9fafb;
  --text: #111827;
  --text-light: #6b7280;
  --border: #e5e7eb;
  --danger: #ef4444;
  --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
.app-header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.app-header .icon {
  width: 36px; height: 36px;
  background: var(--primary-light);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.app-header .title { font-size: 16px; font-weight: 700; color: var(--text); }
.app-header .sub { font-size: 12px; color: var(--text-light); margin-top: 1px; }
.app-header .dot {
  margin-left: auto;
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: #16a34a;
}
.app-header .dot::before {
  content: '';
  width: 7px; height: 7px;
  background: #16a34a;
  border-radius: 50%;
  display: inline-block;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.welcome {
  text-align: center;
  padding: 32px 16px 8px;
}
.welcome h1 { font-size: 22px; margin-bottom: 4px; }
.welcome p { color: var(--text-light); font-size: 14px; }
.quick-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 8px 16px 4px;
}
.quick-buttons button {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 14px;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.quick-buttons button:hover {
  background: var(--primary-light);
  border-color: var(--primary);
}
.message { display: flex; gap: 8px; max-width: 80%; animation: fadeIn .25s ease; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.bot  { align-self: flex-start; }
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.message.bot .avatar  { background: var(--primary-light); }
.message.user .avatar { background: var(--user-bubble); color: #fff; }
.bubble {
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 15px;
  line-height: 1.65;
  word-break: break-word;
  white-space: pre-wrap;
}
.message.user .bubble {
  background: var(--user-bubble);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.message.bot .bubble {
  background: var(--bot-bubble);
  border-bottom-left-radius: 4px;
}
.loading-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
.loading-dots span {
  width: 8px; height: 8px;
  background: var(--text-light);
  border-radius: 50%;
  animation: bounce .6s infinite alternate;
}
.loading-dots span:nth-child(2) { animation-delay: .2s; }
.loading-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { to { opacity: .3; transform: translateY(-4px); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.bubble.error {
  background: #fef2f2;
  color: var(--danger);
  border: 1px solid #fecaca;
}
.input-bar {
  background: #fff;
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.input-bar textarea {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 15px;
  font-family: inherit;
  resize: none;
  outline: none;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color .2s;
}
.input-bar textarea:focus { border-color: var(--primary); }
.input-bar button {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 0 20px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s;
  white-space: nowrap;
}
.input-bar button:disabled { opacity: .5; cursor: not-allowed; }
.disclaimer {
  text-align: center;
  font-size: 11px;
  color: var(--text-light);
  padding: 6px 16px 10px;
  background: #fff;
}
@media (max-width: 600px) {
  .message { max-width: 92%; }
  .welcome h1 { font-size: 18px; }
  .quick-buttons button { font-size: 13px; padding: 6px 12px; }
}
</style>
</head>
<body>

<div class="app-header">
  <div class="icon">📋</div>
  <div>
    <div class="title">差勤小幫手</div>
    <div class="sub">公務人員差勤法規諮詢 · 113年版</div>
  </div>
  <div class="dot">線上</div>
</div>

<div class="chat-container" id="chatContainer">
  <div class="welcome" id="welcome">
    <h1>👋 嗨，我是差勤小幫手</h1>
    <p>有任何公務人員差勤法規問題，都可以問我！</p>
  </div>
  <div class="quick-buttons" id="quickButtons">
    <button data-q="婚假有幾天？請問期限是多久？">💍 婚假天數與期限</button>
    <button data-q="什麼是身心調適假？怎麼請？">🌿 身心調適假</button>
    <button data-q="加班補休的期限是多久？怎麼計算？">⏰ 加班補休期限</button>
    <button data-q="年資休假天數怎麼計算？">📅 年資休假天數</button>
    <button data-q="陪產假有幾天？請假規定是什麼？">🤱 陪產假規定</button>
    <button data-q="病假和生理假的天數與規定是什麼？">🩺 病假與生理假</button>
  </div>
</div>

<div class="input-bar">
  <textarea id="userInput" rows="1" placeholder="輸入差勤相關問題…"></textarea>
  <button id="sendBtn">送出</button>
</div>
<div class="disclaimer">⚠️ 回答僅供參考，正式請假請依各機關差勤系統與人事規定為準</div>

<script>
const WORKER_URL = 'https://leave-chatbot-proxy.founderai813.workers.dev';

const SYSTEM_PROMPT = `你是一位專業的台灣公務人員差勤法規專家助理，名叫「差勤小幫手」。請根據現行法規清楚、親切地回答差勤相關問題。

假別規定：
- 婚假：14 天，須於結婚之日起 3 個月內請畢
- 事假：每年 7 天（含身心調適假合計）
- 病假：每年 28 天
- 生理假：每月 1 天，全年以 3 天為限，不併入病假
- 喪假：父母/配偶/子女 15 天；祖父母/外祖父母/配偶父母 7 天；兄弟姊妹 5 天
- 產假：56 天（妊娠 20 週以上）
- 陪產檢及陪產假：7 天
- 育嬰留職停薪：子女 3 歲前，每次至少 6 個月
- 公傷病假：不計入病假
- 身心調適假：113 年新增，每年 3 天，不需證明，併入事假
- 家庭照顧假：每年 7 天，併入事假

休假天數：滿1年7天、滿3年14天、滿6年21天、滿9年28天、滿14年30天，可保留至次年6月底。

加班補償：補休期限 2 年，逾期視同放棄或折算加班費。

回答時請條列清楚，並建議洽詢人事單位確認。若問題與差勤無關請婉轉說明。`;

let conversationHistory = [];
let isLoading = false;

const chatContainer = document.getElementById('chatContainer');
const quickButtons  = document.getElementById('quickButtons');
const userInput     = document.getElementById('userInput');
const sendBtn       = document.getElementById('sendBtn');
const welcome       = document.getElementById('welcome');

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isLoading && userInput.value.trim()) sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

quickButtons.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-q]');
  if (!btn) return;
  userInput.value = btn.dataset.q;
  userInput.dispatchEvent(new Event('input'));
  sendMessage();
});

function appendMessage(role, content, isError) {
  if (welcome) welcome.style.display = 'none';
  if (role === 'user' && quickButtons) quickButtons.style.display = 'none';
  const wrapper = document.createElement('div');
  wrapper.className = `message ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'bot' ? '🤖' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (isError ? ' error' : '');
  bubble.textContent = content;
  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatContainer.appendChild(wrapper);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function showLoading() {
  const wrapper = document.createElement('div');
  wrapper.className = 'message bot';
  wrapper.id = 'loadingMsg';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatContainer.appendChild(wrapper);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function hideLoading() {
  const el = document.getElementById('loadingMsg');
  if (el) el.remove();
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isLoading) return;
  isLoading = true;
  sendBtn.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';
  appendMessage('user', text);
  conversationHistory.push({ role: 'user', parts: [{ text }] });
  showLoading();
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: conversationHistory,
        generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
      })
    });
    hideLoading();
    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      if (response.status === 429) throw { type: 'rate_limit' };
      if (response.status === 500) throw { type: 'server_error' };
      throw { type: 'api_error', status: response.status };
    }
    const data = await response.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!reply) throw { type: 'empty_response' };
    conversationHistory.push({ role: 'model', parts: [{ text: reply }] });
    appendMessage('bot', reply);
  } catch (err) {
    hideLoading();
    let errMsg;
    if (err.type === 'rate_limit') errMsg = '⚠️ 請求過於頻繁，請稍後再試。';
    else if (err.type === 'server_error') errMsg = '⚠️ 伺服器設定錯誤，請聯絡管理員。';
    else if (err.type === 'empty_response') errMsg = '⚠️ 收到空白回應，請重新嘗試。';
    else if (err instanceof TypeError) errMsg = '⚠️ 網路連線失敗，請檢查網路狀態。';
    else errMsg = '⚠️ 發生未知錯誤，請稍後再試。';
    conversationHistory.pop();
    appendMessage('bot', errMsg, true);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
}

userInput.focus();
</script>
</body>
</html>
