<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>差勤小幫手 — 公務人員差勤法規諮詢</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #4f46e5;
  --primary-light: #e0e7ff;
  --user-bubble: #4f46e5;
  --bot-bubble: #f3f4f6;
  --bg: #f9fafb;
  --text: #111827;
  --text-light: #6b7280;
  --border: #e5e7eb;
  --danger: #ef4444;
  --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
.app-header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.app-header .icon {
  width: 36px; height: 36px;
  background: var(--primary-light);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.app-header .title { font-size: 16px; font-weight: 700; color: var(--text); }
.app-header .sub { font-size: 12px; color: var(--text-light); margin-top: 1px; }
.app-header .dot {
  margin-left: auto;
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: #16a34a;
}
.app-header .dot::before {
  content: '';
  width: 7px; height: 7px;
  background: #16a34a;
  border-radius: 50%;
  display: inline-block;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.welcome {
  text-align: center;
  padding: 32px 16px 8px;
}
.welcome h1 { font-size: 22px; margin-bottom: 4px; }
.welcome p { color: var(--text-light); font-size: 14px; }
.quick-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 8px 16px 4px;
}
.quick-buttons button {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 14px;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.quick-buttons button:hover {
  background: var(--primary-light);
  border-color: var(--primary);
}
.message { display: flex; gap: 8px; max-width: 80%; animation: fadeIn .25s ease; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.bot  { align-self: flex-start; }
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.message.bot .avatar  { background: var(--primary-light); }
.message.user .avatar { background: var(--user-bubble); color: #fff; }
.bubble {
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 15px;
  line-height: 1.65;
  word-break: break-word;
  white-space: pre-wrap;
}
.message.user .bubble {
  background: var(--user-bubble);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.message.bot .bubble {
  background: var(--bot-bubble);
  border-bottom-left-radius: 4px;
}
.loading-dots { display: inline-flex; gap: 4px; padding: 4px 0; }
.loading-dots span {
  width: 8px; height: 8px;
  background: var(--text-light);
  border-radius: 50%;
  animation: bounce .6s infinite alternate;
}
.loading-dots span:nth-child(2) { animation-delay: .2s; }
.loading-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { to { opacity: .3; transform: translateY(-4px); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.bubble.error {
  background: #fef2f2;
  color: var(--danger);
  border: 1px solid #fecaca;
}
.input-bar {
  background: #fff;
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.input-bar textarea {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 15px;
  font-family: inherit;
  resize: none;
  outline: none;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color .2s;
}
.input-bar textarea:focus { border-color: var(--primary); }
.input-bar button {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 0 20px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s;
  white-space: nowrap;
}
.input-bar button:disabled { opacity: .5; cursor: not-allowed; }
.disclaimer {
  text-align: center;
  font-size: 11px;
  color: var(--text-light);
  padding: 6px 16px 10px;
  background: #fff;
}
@media (max-width: 600px) {
  .message { max-width: 92%; }
  .welcome h1 { font-size: 18px; }
  .quick-buttons button { font-size: 13px; padding: 6px 12px; }
}
</style>
</head>
<body>

<div class="app-header">
  <div class="icon">📋</div>
  <div>
    <div class="title">差勤小幫手</div>
    <div class="sub">公務人員差勤法規諮詢 · 113年版</div>
  </div>
  <div class="dot">線上</div>
</div>

<div class="chat-container" id="chatContainer">
  <div class="welcome" id="welcome">
    <h1>👋 嗨，我是差勤小幫手</h1>
    <p>有任何公務人員差勤法規問題，都可以問我！</p>
  </div>
  <div class="quick-buttons" id="quickButtons">
    <button data-q="婚假有幾天？請問期限是多久？">💍 婚假天數與期限</button>
    <button data-q="什麼是身心調適假？怎麼請？">🌿 身心調適假</button>
    <button data-q="加班補休的期限是多久？怎麼計算？">⏰ 加班補休期限</button>
    <button data-q="年資休假天數怎麼計算？">📅 年資休假天數</button>
    <button data-q="陪產假有幾天？請假規定是什麼？">🤱 陪產假規定</button>
    <button data-q="病假和生理假的天數與規定是什麼？">🩺 病假與生理假</button>
  </div>
</div>

<div class="input-bar">
  <textarea id="userInput" rows="1" placeholder="輸入差勤相關問題…"></textarea>
  <button id="sendBtn">送出</button>
</div>
<div class="disclaimer">⚠️ 回答僅供參考，正式請假請依各機關差勤系統與人事規定為準</div>

<script>
const WORKER_URL = 'https://leave-chatbot-proxy.founderai813.workers.dev';

const SYSTEM_PROMPT = `你是經濟部產業發展署的差勤法規專家助理，名叫「差勤小幫手」。請用親切專業的語氣回答同仁的差勤相關問題，首次回覆請以「同仁您好」開頭。

【法規依據】
主要法規：公務人員請假規則、公務員服務法、性別平等工作法（公務員準用）、勞工請假規則（部分準用）、軍公教員工待遇支給要點、公務人員加班費支給辦法、行政院人事行政總處出差旅費報支要點、公務人員考績法施行細則

【請假假別與天數】（依公務人員請假規則）

一、休假（年資特休）
- 服務滿 1 年：7 日
- 滿 3 年：14 日
- 滿 6 年：21 日
- 滿 9 年：28 日
- 滿 14 年：30 日（上限）
- 未用完者得保留至次年 6 月 30 日前使用
- 曾任公務年資得併計（依銓敘部函釋）

二、事假
- 每年 7 日
- 超過部分按日扣除俸（薪）給
- 得分次請，每次最少 1 小時
- 銓敘部函釋：事假時數以當日上班總時數計算

三、家庭照顧假
- 每年 7 日，併入事假計算
- 適用情形：家庭成員預防接種、嚴重疾病、重大事故必須親自照顧
- 性別平等工作法第 20 條適用

四、病假
- 每年 28 日（非連續計算）
- 因重大傷病或分娩得延長：女性生理日得請生理假
- 連續病假超過 30 日須檢附醫師證明
- 延長病假最多 1 年（經機關核准）
- 延長病假期間：前半年照全薪、後半年半薪

五、生理假（性別平等工作法第 14 條準用）
- 每月 1 日，全年 3 日內不併入病假
- 超過 3 日部分併入病假計算
- 不需檢附證明
- 薪資比照病假

六、婚假
- 14 日
- 應於結婚前 10 日起 3 個月內請畢
- 經機關長官核准得延長至 1 年內（銓敘部函釋採寬認）
- 得分次請畢
- 離婚再婚亦可再請

七、喪假
- 父母、配偶死亡：15 日
- 繼父母、配偶之父母、子女死亡：10 日
- 曾祖父母、祖父母、配偶之祖父母、兄弟姊妹死亡：5 日
- 應於 100 日內請畢
- 得分次請（銓敘部函釋）

八、公傷病假
- 因執行職務受傷或生病
- 視實際需要給假
- 不計入病假
- 薪資照給
- 須檢附公立醫院或勞工保險特約醫療機構診斷書

九、公假
- 參加政府機關舉辦之考試、訓練
- 選舉投票、應徵服役體檢
- 兵役徵集
- 依法應受傳喚作證
- 防疫隔離（依傳染病防治法）
- 骨髓或器官捐贈（依實際需要）

十、產假（性別平等工作法準用）
- 分娩前後合計：42 日（5 日）→ 已修正為 8 週 56 日
- 妊娠滿 20 週以上流產：42 日
- 妊娠 12 週以上未滿 20 週流產：21 日
- 妊娠未滿 12 週流產：14 日
- 薪資照給

十一、陪產檢及陪產假
- 配偶分娩：7 日
- 陪產檢（懷孕期間陪同產檢）：7 日（合併計算）
- 應於配偶分娩日前後 15 日內請畢（但陪產檢得於懷孕期間請）
- 114 年人事總處新制：放寬併入陪產檢合計為 7 日

十二、骨髓或器官捐贈假
- 視實際需要給假
- 捐血：每次 4 小時（需檢附證明）

十三、安胎假（準用勞工請假規則）
- 經醫師診斷需安胎休養者
- 得請至最長 1 年病假（含產假期間）

十四、身心調適假（113 年新增）
- 每年 3 日
- 併入事假計算（但總事假日數保留 7 日計算）
- 不需檢附證明
- 不影響考績
- 主管不得拒絕
- 依據：113 年 3 月 1 日行政院人事行政總處發布之「公務人員請假規則部分條文修正草案」

十五、其他特殊假別
- 家庭暴力被害人安全假：依家庭暴力防治法
- 選舉投票：投票當日為公假
- 志願服務員：依志願服務法給公假
- 哺乳假：每日 60 分鐘（子女未滿 2 歲）

【加班與補休】
- 加班費支給：依公務人員加班費支給辦法
- 平日加班：按時數給補休或加班費
- 休假日加班：可折 1.5 倍
- 補休期限：自加班之日起 2 年內（113 年修正延長，舊制為 1 年）
- 每月加班補休上限 60 小時（特殊情況得放寬）
- 逾期未休畢者：依規定核發加班費或視同放棄

【出差相關】
- 依行政院人事行政總處出差旅費報支要點
- 出差性質：國內出差、國外出差
- 出差日當日往返計日、跨夜計算夜宿津貼
- 出差期間病假應返回機關補請

【育嬰留職停薪】（性別平等工作法第 16 條準用）
- 任職滿 6 個月得申請
- 子女滿 3 歲前得申請
- 每次至少 6 個月，最長至子女滿 3 歲
- 期間不影響考績年資採計（復職後續計）
- 期間得選擇繼續繳納保險費以維持年資

【其他服務規定】（公務員服務法）
- 工作時間：每週 40 小時，每日 8 小時
- 不得兼職兼業（第 14 條）
- 兼課須經核准（依大學法、教育人員任用條例配套）

【重要解釋函釋參考】
- 銓敘部 103 年函釋：休假年資得合併計算舊年資
- 人事總處 113 年公告：身心調適假上路、陪產檢陪產假合併
- 人事總處 113.12 公告：加班補休期限延長至 2 年
- 銓敘部解釋：喪假、婚假得分次請，但應於期限內請畢

【政府公告】
- 行政院人事行政總處每年公告：
  - 國定假日放假日期
  - 調整放假日（含補班日）
  - 春節年假、端午、中秋及國慶連假
- 重大疫情期間（如 COVID-19）：曾有防疫照顧假、居家隔離公假等措施

【回答原則】
1. 引用具體條文（例：公務人員請假規則第 3 條第 X 款）與天數
2. 適時提及函釋字號（若能確定）
3. 語氣親切、條理分明，適度條列或用表格
4. 若問題超出公務人員差勤範圍（如勞工、軍人），禮貌告知並建議查詢對應法規
5. 若法規有解釋空間或地方機關有不同規定，提醒使用者以服務機關人事單位之解釋為準
6. 不提供個人隱私或特定機關內部規定
7. 法規若有修正，以最新版本為準（113 年版為主）`;

let conversationHistory = [];
let isLoading = false;

const chatContainer = document.getElementById('chatContainer');
const quickButtons  = document.getElementById('quickButtons');
const userInput     = document.getElementById('userInput');
const sendBtn       = document.getElementById('sendBtn');
const welcome       = document.getElementById('welcome');

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isLoading && userInput.value.trim()) sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

quickButtons.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-q]');
  if (!btn) return;
  userInput.value = btn.dataset.q;
  userInput.dispatchEvent(new Event('input'));
  sendMessage();
});

function appendMessage(role, content, isError) {
  if (welcome) welcome.style.display = 'none';
  const wrapper = document.createElement('div');
  wrapper.className = `message ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'bot' ? '🤖' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (isError ? ' error' : '');
  bubble.textContent = content;
  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatContainer.appendChild(wrapper);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function showLoading() {
  const wrapper = document.createElement('div');
  wrapper.className = 'message bot';
  wrapper.id = 'loadingMsg';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  chatContainer.appendChild(wrapper);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function hideLoading() {
  const el = document.getElementById('loadingMsg');
  if (el) el.remove();
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isLoading) return;
  isLoading = true;
  sendBtn.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';
  appendMessage('user', text);
  conversationHistory.push({ role: 'user', parts: [{ text }] });
  showLoading();
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: conversationHistory,
        generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
      })
    });
    hideLoading();
    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      if (response.status === 429) throw { type: 'rate_limit' };
      if (response.status === 500) throw { type: 'server_error' };
      throw { type: 'api_error', status: response.status };
    }
    const data = await response.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!reply) throw { type: 'empty_response' };
    conversationHistory.push({ role: 'model', parts: [{ text: reply }] });
    appendMessage('bot', reply);
  } catch (err) {
    hideLoading();
    let errMsg;
    if (err.type === 'rate_limit') errMsg = '⚠️ 請求過於頻繁，請稍後再試。';
    else if (err.type === 'server_error') errMsg = '⚠️ 伺服器設定錯誤，請聯絡管理員。';
    else if (err.type === 'empty_response') errMsg = '⚠️ 收到空白回應，請重新嘗試。';
    else if (err instanceof TypeError) errMsg = '⚠️ 網路連線失敗，請檢查網路狀態。';
    else errMsg = '⚠️ 發生未知錯誤，請稍後再試。';
    conversationHistory.pop();
    appendMessage('bot', errMsg, true);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
}

userInput.focus();
</script>
</body>
</html>
